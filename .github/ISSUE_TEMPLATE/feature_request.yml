name: Feature request
description: 提议一个有明确使用场景的改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 完成后用户应该能够做什么？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法
      description: 现有流程或替代方案为什么不够？
  - type: textarea
    id: context
    attributes:
      label: 补充背景
      description: 可添加不含敏感资料的示例、草图或参考链接。
